services:
  api:
    build: ../backend
    restart: unless-stopped
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes: [collector-data:/data]
    ports: ['127.0.0.1:18000:8000']
    command: [sh, -c, 'alembic upgrade head && python -m collector.cli cleanup && uvicorn collector.api:app --host 0.0.0.0 --port 8000 --no-access-log']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  worker:
    build: ../backend
    restart: unless-stopped
    volumes: [collector-data:/data]
    environment:
      INGEST_TOKEN: ${INGEST_TOKEN:?set a random token}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    command: [uvicorn, collector.worker:app, --host, 0.0.0.0, --port, '8001', --no-access-log]
    ports: ['127.0.0.1:18001:8001']
    depends_on:
      api:
        condition: service_healthy
    logging: *logging
volumes:
  collector-data:
